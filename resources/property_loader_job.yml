# A sample job for rent_analysis.

resources:
  jobs:
    property_loader_job:
      name: property_loader_job

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: technical_catalog_name
          default: ${var.technical_catalog_name}
        - name: bronze_schema_name
          default: ${var.bronze_schema_name}
        - name: silver_schema_name
          default: ${var.silver_schema_name}
        - name: gold_schema_name
          default: ${var.gold_schema_name}
        - name: source_data_schema_name
          default: ${var.source_data_schema_name}

      tasks:
        - task_key: load_bronze_airbnb
          environment_key: default
          python_wheel_task:
            entry_point: load_bronze_airbnb
            package_name: rent_analysis

        - task_key: load_silver_airbnb
          depends_on:
            - task_key: load_bronze_airbnb
          environment_key: default
          python_wheel_task:
            entry_point: load_silver_airbnb
            package_name: rent_analysis
            named_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              technical_catalog_name: "{{job.parameters.technical_catalog_name}}"
              bronze_schema_name: "{{job.parameters.bronze_schema_name}}"
              silver_schema_name: "{{job.parameters.silver_schema_name}}"
              gold_schema_name: "{{job.parameters.gold_schema_name}}"
              source_data_schema_name: "{{job.parameters.source_data_schema_name}}"

        - task_key: load_bronze_kamernet
          environment_key: default
          python_wheel_task:
            entry_point: load_bronze_kamernet
            package_name: rent_analysis

        - task_key: load_silver_kamernet
          depends_on:
            - task_key: load_bronze_kamernet
          environment_key: default
          python_wheel_task:
            entry_point: load_silver_kamernet
            package_name: rent_analysis
            named_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              technical_catalog_name: "{{job.parameters.technical_catalog_name}}"
              bronze_schema_name: "{{job.parameters.bronze_schema_name}}"
              silver_schema_name: "{{job.parameters.silver_schema_name}}"
              gold_schema_name: "{{job.parameters.gold_schema_name}}"
              source_data_schema_name: "{{job.parameters.source_data_schema_name}}"

        - task_key: load_gold_revenue
          depends_on:
            - task_key: load_silver_airbnb
            - task_key: load_silver_kamernet
          environment_key: default
          python_wheel_task:
            entry_point: load_gold_revenue
            package_name: rent_analysis
            named_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              technical_catalog_name: "{{job.parameters.technical_catalog_name}}"
              bronze_schema_name: "{{job.parameters.bronze_schema_name}}"
              silver_schema_name: "{{job.parameters.silver_schema_name}}"
              gold_schema_name: "{{job.parameters.gold_schema_name}}"
              source_data_schema_name: "{{job.parameters.source_data_schema_name}}"

        - task_key: load_gold_statistics_per_district
          depends_on:
            - task_key: load_silver_airbnb
            - task_key: load_silver_kamernet
          environment_key: default
          python_wheel_task:
            entry_point: load_gold_statistics_per_district
            package_name: rent_analysis
            named_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              technical_catalog_name: "{{job.parameters.technical_catalog_name}}"
              bronze_schema_name: "{{job.parameters.bronze_schema_name}}"
              silver_schema_name: "{{job.parameters.silver_schema_name}}"
              gold_schema_name: "{{job.parameters.gold_schema_name}}"
              source_data_schema_name: "{{job.parameters.source_data_schema_name}}"

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              # By default we just include the .whl file generated for the rent_analysis package.
              # See https://docs.databricks.com/dev-tools/bundles/library-dependencies.html
              # for more information on how to add other libraries.
              - ../dist/*.whl
