# This is a Databricks asset bundle definition for rent_analysis.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: rent_analysis
  uuid: 3b4d3551-26bc-4963-b1ee-b173b8ca7a99

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog_name:
    description: The catalog to use for the bronze job
  technical_catalog_name:
    description: The catalog containing source data volumes
  bronze_schema_name:
    description: The schema to use for bronze tables
  silver_schema_name:
    description: The schema to use for silver tables
  gold_schema_name:
    description: The schema to use for gold tables
  source_data_schema_name:
    description: The schema containing source data volumes
  warehouse_id:
    description: The SQL warehouse used to run dashboards
    default: 38feb426d0b5fbe9

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-45bf58f8-78cd.cloud.databricks.com
    variables:
      catalog_name: rent_analysis
      technical_catalog_name: technical
      bronze_schema_name: bronze
      silver_schema_name: silver
      gold_schema_name: gold
      source_data_schema_name: source_data

  prod:
    mode: production
    workspace:
      host: https://dbc-45bf58f8-78cd.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bencesomogyi56@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bencesomogyi56@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: bencesomogyi56@gmail.com
        level: CAN_MANAGE
