[project]
name = "rent_analysis"
version = "0.0.2"
authors = [{ name = "bencesomogyi56@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
load_bronze_airbnb = "rent_analysis.tasks.bronze_airbnb_loader:BronzeAirbnbLoader.execute_task"
load_bronze_kamernet = "rent_analysis.tasks.bronze_kamernet_loader:BronzeKamernetLoader.execute_task"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
