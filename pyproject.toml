[project]
name = "rent_analysis"
version = "0.0.4"
authors = [{ name = "bencesomogyi56@gmail.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pre-commit>=4.6.2",
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    "pyright>=1.1.414",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=15.4,<15.5",
    "ipykernel",
]

[project.scripts]
load_bronze_airbnb = "rent_analysis.tasks.bronze_airbnb_loader:BronzeAirbnbLoader.execute_task"
load_bronze_kamernet = "rent_analysis.tasks.bronze_kamernet_loader:BronzeKamernetLoader.execute_task"
load_silver_airbnb = "rent_analysis.tasks.silver_airbnb_loader:SilverAirbnbLoader.execute_task"
load_silver_kamernet = "rent_analysis.tasks.silver_kamernet_loader:SilverKamernetLoader.execute_task"
load_gold_revenue = "rent_analysis.tasks.gold_revenue_loader:GoldRevenuePerPropertyLoader.execute_task"
load_gold_statistics_per_district = "rent_analysis.tasks.gold_statistics_per_district:GoldStatisticsPerDistrictLoader.execute_task"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rent_analysis"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["D"]
ignore = ["D203", "D213"]
